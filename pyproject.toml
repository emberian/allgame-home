[project]
name = "allgame"
version = "0.1.0"
description = "Claude Tulip Resident — persistent AI community member"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "boto3>=1.43.10",
    "claude-agent-sdk>=0.2.165",
    "dearpygui>=2.0",
    "google-genai>=1.68.0",
    "pypdf>=6.14.2",
    "discord.py>=2.4.0",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "zulip>=0.9.0",
    "libipld>=3.4.1",
    "websockets>=16.0",
    "allgame-public",
]

[project.scripts]
claude-resident = "claude_resident.__main__:main"

[tool.uv.sources]
allgame-public = { path = "../allgame-public", editable = true }
